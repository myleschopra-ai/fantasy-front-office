name: Apply draft calibration patch

on:
  push:
    branches:
      - agent/real-data-draft-validation
    paths:
      - 'scripts/apply_draft_calibration_patch.py'
      - '.github/workflows/apply-draft-calibration.yml'

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[calibration-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/real-data-draft-validation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct deterministic VORP fixture
        run: sed -i "s/\['TE', 230, 4, 20\]/['TE', 230, 2, 20]/" scripts/apply_draft_calibration_patch.py
      - name: Apply deterministic source patch
        run: python scripts/apply_draft_calibration_patch.py
      - name: Run draft intelligence tests
        run: node tests/draft-intelligence.test.js
      - name: Commit calibrated engine and tests
        run: |
          if git diff --quiet -- js/draft-intelligence.js tests/draft-intelligence.test.js; then
            echo 'Calibration patch already applied.'
            exit 0
          fi
          git config user.name 'fantasy-front-office-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/draft-intelligence.js tests/draft-intelligence.test.js
          git commit -m 'Calibrate league value and cross-position VORP [calibration-applied]'
          git push origin HEAD:agent/real-data-draft-validation
