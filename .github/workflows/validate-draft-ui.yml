name: Validate draft room UI

on:
  pull_request:
    paths:
      - 'draft.html'
      - 'mock-draft-v4.html'
      - 'auction.html'
      - 'tests/draft-ui.test.js'
      - '.github/workflows/validate-draft-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft-ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run draft room UI smoke tests
        run: node tests/draft-ui.test.js
      - name: Ensure referenced draft pages exist
        run: |
          test -f mock-draft-v4.html
          test -f auction.html
          test -f js/draft-intelligence.js
          test -f js/auction-intelligence.js
