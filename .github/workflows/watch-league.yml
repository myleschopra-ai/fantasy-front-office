name: Watch League Activity

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run league watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 scripts/league_watcher.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add watcher_state.json
          git diff --staged --quiet && echo "No state changes" || git commit -m "Update watcher state"
          git push
