name: Collect Football Data

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Space-separated NFL seasons"
        required: true
        default: "2024 2025 2026"
      cfbd_year:
        description: "College football season"
        required: true
        default: "2026"
      cfbd_teams:
        description: "Optional pipe-separated teams, e.g. Ohio State|Alabama"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-data.txt

      - name: Install data dependencies
        run: python -m pip install -r requirements-data.txt

      - name: Validate collectors compile
        run: python -m py_compile scripts/collectors/nflverse.py scripts/collectors/cfbd.py

      - name: Collect nflverse datasets
        shell: bash
        run: python scripts/collectors/nflverse.py --seasons ${{ inputs.seasons }}

      - name: Collect CollegeFootballData datasets
        if: ${{ secrets.CFBD_API_KEY != '' }}
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFBD_TEAMS: ${{ inputs.cfbd_teams }}
        shell: bash
        run: |
          args=(--year "${{ inputs.cfbd_year }}")
          if [[ -n "$CFBD_TEAMS" ]]; then
            IFS='|' read -ra teams <<< "$CFBD_TEAMS"
            args+=(--teams "${teams[@]}")
          fi
          python scripts/collectors/cfbd.py "${args[@]}"

      - name: Explain skipped CFBD collection
        if: ${{ secrets.CFBD_API_KEY == '' }}
        run: echo "CFBD_API_KEY is not configured; college collection was skipped."

      - name: Upload candidate raw-data bundle
        uses: actions/upload-artifact@v4
        with:
          name: football-data-candidate-${{ github.run_id }}
          path: data/raw/
          if-no-files-found: error
          retention-days: 14

      - name: Publication boundary
        run: |
          echo "Raw data was collected as an artifact only."
          echo "No production prospect board or dashboard file was overwritten."
