name: Refresh weekly decision feed

# Owns data/weekly_projections.json, its per-week history, schedule signals,
# the weekly scorecard and the decision ledger. Season-long draft
# intelligence and its backtests stay in refresh-draft-intelligence.yml and
# never gate this feed.

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Projection week (blank = next NFL week from the schedule)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "scripts/weekly_projection_engine.py"
      - "scripts/build_weekly_projections.py"
      - "scripts/resolve_projection_week.py"
      - "scripts/weekly_scorecard.mjs"
      - "js/roster-improvement-engine.js"
      - "js/dashboard-intelligence.js"
      - ".github/workflows/refresh-weekly-projections.yml"
  schedule:
    # September through January: Tuesday and Thursday mornings, Saturday
    # afternoon, and Sunday before the early kickoffs (all UTC).
    - cron: "23 9 * 1,9-12 2,4"
    - cron: "23 15 * 1,9-12 6"
    - cron: "23 13 * 1,9-12 0"

permissions:
  contents: write

concurrency:
  group: weekly-decision-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LEAGUE_ID: "1337549680476721152"
      MY_ROSTER_ID: "9"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install pinned data dependencies
        run: python -m pip install -r requirements-data.txt
      - name: Run engine regression tests
        run: |
          python -m unittest tests.test_weekly_projection_engine tests.test_backtest_open_projections
          node tests/roster-improvement-engine.test.js
          node tests/season-model.test.js
          node tests/weekly-scorecard.test.js
      - name: Select season and week
        shell: bash
        run: |
          NFL_SEASON="$(date -u +%Y)"
          if [ "$(date -u +%m)" -le 2 ]; then NFL_SEASON=$((NFL_SEASON-1)); fi
          echo "NFL_SEASON=$NFL_SEASON" >> "$GITHUB_ENV"
      - name: Collect time-locked weekly inputs
        shell: bash
        run: |
          python scripts/collectors/nflverse.py \
            --seasons "$((NFL_SEASON-1))" "$NFL_SEASON" \
            --datasets weekly_stats snap_counts injuries depth_charts ff_opportunity schedules weekly_rosters
      - name: Build this week's projection and any missing weekly history
        shell: bash
        run: |
          NFL_WEEK="${{ github.event.inputs.week }}"
          if [ -z "$NFL_WEEK" ]; then NFL_WEEK="$(python scripts/resolve_projection_week.py --season "$NFL_SEASON")"; fi
          echo "NFL_WEEK=$NFL_WEEK" >> "$GITHUB_ENV"
          python scripts/build_weekly_projections.py --season "$NFL_SEASON" --week "$NFL_WEEK"
          for WEEK in $(seq 1 $((NFL_WEEK-1))); do
            HISTORY="data/weekly_projections/${NFL_SEASON}-w$(printf '%02d' "$WEEK").json"
            if [ ! -f "$HISTORY" ]; then
              echo "Backfilling $HISTORY"
              python scripts/build_weekly_projections.py --season "$NFL_SEASON" --week "$WEEK" --output "$RUNNER_TEMP/backfill-w$WEEK.json"
            fi
          done
          python scripts/build_schedule_signals.py
      - name: Validate the weekly snapshot before publishing
        run: python scripts/validate_projection_pipeline.py --report artifacts/projection-pipeline-validation.json
      - name: Publish the weekly projection
        shell: bash
        run: |
          git config user.name "fantasy-front-office-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly_projections.json data/weekly_projections data/schedule_signals.json
          if git diff --staged --quiet; then echo "No projection change."; exit 0; fi
          git commit -m "refresh weekly projections ${NFL_SEASON} week ${NFL_WEEK} [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1
      - name: Score completed weeks and append the decision ledger
        run: node scripts/weekly_scorecard.mjs --season "$NFL_SEASON" --league "$LEAGUE_ID" --roster "$MY_ROSTER_ID"
      - name: Publish scorecards and ledger
        shell: bash
        run: |
          git add data/scorecards data/ledger
          if git diff --staged --quiet; then echo "No scorecard change."; exit 0; fi
          git commit -m "score weekly decisions ${NFL_SEASON} through week $((NFL_WEEK-1)) [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weekly-decision-feed-${{ github.run_id }}
          path: |
            artifacts/projection-pipeline-validation.json
            data/raw/nflverse/manifest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Push an alert when the feed fails
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC is not set"; exit 0; fi
          curl -fsS -H "Title: Weekly decision feed failed" -H "Priority: high" \
            -d "Run ${GITHUB_RUN_ID} failed. The dashboard is serving stale projections until it is fixed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "https://ntfy.sh/${NTFY_TOPIC}"
