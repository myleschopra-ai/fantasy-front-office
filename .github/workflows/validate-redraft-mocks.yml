name: Validate redraft snake and auction mocks

on:
  pull_request:
    paths:
      - 'scripts/validate_redraft_mock_formats.py'
      - 'scripts/validate_redraft_strong_baselines.py'
      - 'scripts/validate_auction_sensitivity.py'
      - '.github/workflows/validate-redraft-mocks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate against competent market baselines
        run: python scripts/validate_redraft_strong_baselines.py data/backtests/redraft-mock-validation-strong
      - name: Stress test auction bidder assumptions
        run: python scripts/validate_auction_sensitivity.py data/backtests/auction-sensitivity
      - name: Upload validation reports
        uses: actions/upload-artifact@v4
        with:
          name: redraft-mock-validation
          path: |
            data/backtests/redraft-mock-validation-strong/
            data/backtests/auction-sensitivity/
