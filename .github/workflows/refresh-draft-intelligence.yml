name: Refresh draft intelligence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_draft_intelligence.py"
      - "scripts/validate_draft_intelligence.py"
      - "config/coaching_sources.json"
      - ".github/workflows/refresh-draft-intelligence.yml"
  schedule:
    - cron: "17 10 * 5-9 1,4"
    - cron: "17 10 1 1-4,10-12 *"

permissions:
  contents: write

concurrency:
  group: draft-intelligence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned data dependencies
        run: python -m pip install nflreadpy==0.1.5 beautifulsoup4==4.13.4
      - name: Run model and parser regression tests
        run: |
          node tests/draft-intelligence.test.js
          python -m unittest discover -s tests
      - name: Select the current draft season
        run: echo "NFL_SEASON=$(date -u +%Y)" >> "$GITHUB_ENV"
      - name: Build ranking, tier, and scheme-fit snapshot
        run: python scripts/build_draft_intelligence.py --season "$NFL_SEASON" --teams 12
      - name: Validate snapshot before publishing
        run: python scripts/validate_draft_intelligence.py data/draft_intelligence.json
      - name: Commit a changed verified snapshot
        run: |
          if git diff --quiet -- data/draft_intelligence.json; then
            echo "No material data change."
            exit 0
          fi
          git config user.name "fantasy-front-office-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draft_intelligence.json
          git commit -m "refresh draft intelligence [skip ci]"
          git push
