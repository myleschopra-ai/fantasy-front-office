name: Refresh draft intelligence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "fantasypros.json"
      - "scripts/build_draft_intelligence.py"
      - "scripts/validate_draft_intelligence.py"
      - "scripts/open_projection_engine.py"
      - "scripts/collectors/nflverse.py"
      - "scripts/collectors/sleeper_players.py"
      - "scripts/build_player_identity.py"
      - "scripts/build_rookie_profiles.py"
      - "scripts/build_weekly_projections.py"
      - "scripts/weekly_projection_engine.py"
      - "scripts/data_foundation.py"
      - "scripts/validate_projection_pipeline.py"
      - "scripts/backtest_weekly_projections.py"
      - "config/coaching_sources.json"
      - ".github/workflows/refresh-draft-intelligence.yml"
  schedule:
    - cron: "17 10 * 5-9 1,4"
    - cron: "17 10 1 1-4,10-12 *"

permissions:
  contents: write

concurrency:
  group: draft-intelligence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned data dependencies
        run: python -m pip install -r requirements-data.txt beautifulsoup4==4.13.4
      - name: Run model and parser regression tests
        run: |
          node tests/draft-intelligence.test.js
          python -m unittest discover -s tests
      - name: Select the current draft season
        run: echo "NFL_SEASON=$(date -u +%Y)" >> "$GITHUB_ENV"
      - name: Collect time-locked open projection inputs
        shell: bash
        run: |
          python scripts/collectors/nflverse.py \
            --seasons "$((NFL_SEASON-3))" "$((NFL_SEASON-2))" "$((NFL_SEASON-1))" "$NFL_SEASON" \
            --datasets players ff_playerids weekly_stats seasonal_stats schedules snap_counts injuries depth_charts ff_opportunity participation ngs_passing ngs_rushing ngs_receiving pfr_passing pfr_rushing pfr_receiving ftn_charting draft_picks combine
          python scripts/collectors/sleeper_players.py
      - name: Build canonical identity and rookie evidence
        run: |
          python scripts/build_player_identity.py --season "$NFL_SEASON"
          python scripts/build_rookie_profiles.py --season "$NFL_SEASON"
      - name: Build ranking, tier, and scheme-fit snapshot
        run: python scripts/build_draft_intelligence.py --season "$NFL_SEASON" --teams 12
      - name: Build current weekly role projection
        shell: bash
        run: |
          NFL_WEEK="$(python scripts/resolve_projection_week.py --season "$NFL_SEASON")"
          python scripts/build_weekly_projections.py --season "$NFL_SEASON" --week "$NFL_WEEK"
      - name: Run no-lookahead model backtests
        run: |
          python scripts/backtest_open_projections.py --strict
          python scripts/backtest_weekly_projections.py --strict
      - name: Validate snapshot before publishing
        run: |
          python scripts/validate_draft_intelligence.py data/draft_intelligence.json --report artifacts/draft-intelligence-validation.json
          python scripts/validate_projection_pipeline.py --report artifacts/projection-pipeline-validation.json
      - name: Upload collection and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-intelligence-evidence-${{ github.run_id }}
          path: |
            artifacts/draft-intelligence-validation.json
            artifacts/projection-pipeline-validation.json
            reports/open_projection_backtest.json
            reports/weekly_projection_backtest.json
            data/raw/nflverse/manifest.json
          if-no-files-found: warn
          retention-days: 90
      - name: Commit a changed verified snapshot
        run: |
          if git diff --quiet -- data/draft_intelligence.json data/normalized/player_identity.json data/rookie_profiles.json data/weekly_projections.json; then
            echo "No material data change."
            exit 0
          fi
          git config user.name "fantasy-front-office-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draft_intelligence.json data/normalized/player_identity.json data/rookie_profiles.json data/weekly_projections.json
          git commit -m "refresh player projection intelligence [skip ci]"
          git push
