name: Apply Mock Draft Links
on:
  push:
    branches: [feature/mock-draft-companion]
    paths:
      - scripts/add_mock_draft_links.py
      - .github/workflows/apply-mock-draft-links.yml
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[mock-links-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mock-draft-companion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/add_mock_draft_links.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html draft.html
          git commit -m "Expose mock draft companion in dashboard [mock-links-applied]"
          git push
