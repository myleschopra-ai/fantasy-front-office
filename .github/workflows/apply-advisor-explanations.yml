name: Apply advisor explanations

on:
  push:
    branches:
      - agent/draft-advisor-roster-logic
    paths:
      - 'scripts/apply_advisor_explanations.py'
      - '.github/workflows/apply-advisor-explanations.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/draft-advisor-roster-logic
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply advisor explanation patch
        run: python3 scripts/apply_advisor_explanations.py
      - name: Run draft intelligence tests
        run: node tests/draft-intelligence.test.js
      - name: Commit advisor explanations
        run: |
          if git diff --quiet -- js/mock-draft-v4.js; then
            echo 'No advisor explanation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/mock-draft-v4.js
          git commit -m 'Clarify starter need depth and luxury recommendations'
          git push origin HEAD:agent/draft-advisor-roster-logic
