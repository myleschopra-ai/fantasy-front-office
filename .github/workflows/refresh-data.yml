name: Refresh FantasyPros Snapshot

on:
  schedule:
    - cron: "23 13,20 * * *"  # 9am and 4pm ET, offset off :00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run refresh script
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: python3 scripts/refresh_fantasypros.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fantasypros.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto-refresh FantasyPros snapshot"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 3
          done
