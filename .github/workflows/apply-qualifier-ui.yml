name: Apply Qualifier UI

on:
  push:
    branches: [feature/shared-player-qualifiers]
    paths:
      - scripts/apply_qualifier_ui.py
      - .github/workflows/apply-qualifier-ui.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[qualifier-ui-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shared-player-qualifiers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_qualifier_ui.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add draft.html
          git commit -m "Add shared qualifier icons to draft board [qualifier-ui-applied]"
          git push
