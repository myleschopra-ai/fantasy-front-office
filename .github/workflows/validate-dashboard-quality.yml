name: Validate dashboard quality

on:
  pull_request:
  push:
    branches: [main, work/sleeper-room-ui, codex/five-phase-dashboard-quality]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/dashboard-intelligence.test.js
      - run: node tests/dashboard-quality.test.js
      - run: node tests/roster-improvement-engine.test.js
      - run: node tests/roster-engine-integration.test.js

  all-tabs-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.54.2
      - run: npx playwright install chromium
      - run: python3 -m http.server 4185 >/tmp/ffo-dashboard.log 2>&1 &
      - run: node tests/dashboard-tabs-e2e.mjs
      - run: node tests/roster-engine-browser-e2e.cjs
