name: Validate Provider Integrations

on:
  pull_request:
    paths:
      - 'server/**'
      - 'js/**'
      - 'requirements-yahoo.txt'
      - '.github/workflows/validate-provider-integrations.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'js/**'
      - 'requirements-yahoo.txt'
      - '.github/workflows/validate-provider-integrations.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Python adapter
        run: python -m py_compile server/yahoo_oauth.py
      - name: Validate browser JavaScript
        run: node --check js/league-switcher.js
