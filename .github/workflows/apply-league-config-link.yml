name: Apply League Config Link
on:
  push:
    branches: [feature/multi-league-draft-formats]
    paths:
      - scripts/add_league_config_link.py
      - .github/workflows/apply-league-config-link.yml
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[league-link-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multi-league-draft-formats
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/add_league_config_link.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Expose multi-league settings from dashboard [league-link-applied]"
          git push
