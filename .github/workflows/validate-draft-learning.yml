name: Validate draft learning and provider contracts

on:
  pull_request:
    paths:
      - 'js/draft-review.js'
      - 'js/draft-calibration.js'
      - 'js/backtest-intelligence.js'
      - 'js/decision-confidence.js'
      - 'js/auction-intelligence.js'
      - 'js/provider-contract.js'
      - 'js/draft-session.js'
      - 'scripts/import_draft_history.py'
      - 'schemas/draft_history.schema.json'
      - 'tests/draft-review.test.js'
      - 'tests/draft-calibration.test.js'
      - 'tests/backtest-intelligence.test.js'
      - 'tests/decision-confidence.test.js'
      - 'data/model_validation.json'
      - 'tests/auction-intelligence.test.js'
      - 'tests/draft-learning-e2e.mjs'
      - 'tests/provider-contract.test.js'
      - 'draft-review.html'
      - 'auction.html'
      - '.github/workflows/validate-draft-learning.yml'
  push:
    branches: [main]
    paths:
      - 'js/draft-review.js'
      - 'js/draft-calibration.js'
      - 'js/backtest-intelligence.js'
      - 'js/decision-confidence.js'
      - 'js/auction-intelligence.js'
      - 'js/provider-contract.js'
      - 'js/draft-session.js'
      - 'data/model_validation.json'
      - 'scripts/import_draft_history.py'
      - 'schemas/draft_history.schema.json'
      - 'tests/**'
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate review, calibration, and provider boundaries
        run: |
          node tests/draft-review.test.js
          node tests/draft-calibration.test.js
          node tests/backtest-intelligence.test.js
          node tests/decision-confidence.test.js
          node tests/auction-intelligence.test.js
          node tests/provider-contract.test.js
          node tests/draft-session.test.js
      - name: Validate history importer
        run: |
          python3 -m py_compile scripts/import_draft_history.py
          sample="$(mktemp --suffix=.csv)"
          printf 'pick,name,position,player_id\n1,Test Player,RB,1\n' > "$sample"
          python3 scripts/import_draft_history.py "$sample" --kind snake | python3 -m json.tool >/dev/null
      - name: Verify Draft Room builder is idempotent
        run: |
          cp draft-room-v5.html /tmp/draft-room-v5.before
          python3 scripts/build_draft_room_v5.py
          diff -u /tmp/draft-room-v5.before draft-room-v5.html
          node tests/draft-ui.test.js

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4190 --bind 127.0.0.1 > /tmp/ffo-learning-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4190/draft-review.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ffo-learning-http.log
          exit 1
      - name: Validate archive comparison and auction uncertainty flows
        env:
          DRAFT_LEARNING_E2E_URL: http://127.0.0.1:4190
        run: node tests/draft-learning-e2e.mjs
