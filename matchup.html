<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fantasy Front Office — Matchup</title><style>
:root{--bg:#070512;--panel:#15102a;--panel2:#0d091b;--line:#33274f;--text:#f8f5ff;--muted:#9a91b5;--gold:#ffcc00;--green:#00e6b8;--purple:#b000ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:1240px;margin:auto;padding:26px}.hero,.scoreboard,.lineup{background:var(--panel);border:1px solid var(--line);border-radius:14px}.hero{padding:18px}.eyebrow{font:700 11px ui-monospace;color:var(--green);letter-spacing:.08em}.muted{color:var(--muted)}h1{margin:7px 0 4px;font-size:28px}.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;padding:22px;margin-top:14px}.team strong{font-size:22px;display:block}.total{font:700 28px ui-monospace;color:var(--gold)}.versus{color:var(--muted);padding:0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.lineup{padding:16px}.lineup h2{font-size:17px;margin:0 0 12px}.player{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border-radius:9px;padding:10px;margin:6px 0}.slot{color:var(--gold);font:700 11px ui-monospace}.name strong{display:block}.detail{font:11px ui-monospace;color:var(--muted);margin-top:3px}.points{font:700 14px ui-monospace;color:var(--green);text-align:right}.notice{border-left:3px solid var(--purple);padding:11px;background:var(--panel);margin-top:14px}.btn{border:0;border-radius:8px;background:var(--purple);color:white;font-weight:800;padding:9px 13px;cursor:pointer}@media(max-width:760px){.page{padding:14px}.grid{grid-template-columns:1fr}.scoreboard{padding:14px}.team strong{font-size:16px}.total{font-size:20px}.player{grid-template-columns:52px 1fr auto}.detail{font-size:9px}}
</style></head><body><main class="page"><section class="hero"><div class="eyebrow">WEEK <span id="week">—</span> MATCHUP COMMAND CENTER</div><h1 id="title">Loading your matchup…</h1><div id="status" class="muted">Connecting to the saved Sleeper league and current production forecast.</div><button id="retry" class="btn" hidden>Retry matchup data</button></section><section id="scoreboard" class="scoreboard" hidden><div class="team"><strong id="my-name">Your team</strong><span class="muted">Projected</span><div id="my-total" class="total">—</div></div><div class="versus">VS</div><div class="team"><strong id="opp-name">Opponent</strong><span class="muted">Projected</span><div id="opp-total" class="total">—</div></div></section><div id="notice" class="notice" hidden></div><div class="grid"><section class="lineup"><h2>Your suggested starting lineup</h2><div id="my-lineup"></div></section><section class="lineup"><h2>Opponent projected lineup</h2><div id="opp-lineup"></div></section></div></main><script src="js/league-switcher.js"></script><script src="js/matchup-page.js?v=1"></script><script src="js/ffo-shell.js"></script></body></html>
