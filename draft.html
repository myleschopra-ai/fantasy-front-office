<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Front Office — Draft Room</title>
<meta name="theme-color" content="#070a10">
<style>html,body{height:100%;margin:0;background:#070a10;color:#f7f9fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center}.boot{text-align:center;color:#8794a8;font-size:12px}.boot strong{display:block;color:#f7f9fc;font-size:14px;margin-bottom:6px}</style>
<script>
(function(){
  'use strict';
  var params=new URLSearchParams(location.search);
  var requested=String(params.get('mode')||'mock').toLowerCase();
  if(requested==='auction'){
    params.delete('mode');
    location.replace('auction.html'+(params.toString()?'?'+params.toString():''));
    return;
  }
  if(requested==='live') params.set('draftMode','manual');
  params.delete('mode');
  location.replace('draft-room-v5.html'+(params.toString()?'?'+params.toString():''));
})();
</script>
</head>
<body><div class="boot"><strong>Opening Draft Room…</strong>Opening iOS-first draftboard.</div></body>
</html>
