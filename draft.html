<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Front Office — Draft Room</title>
<meta name="theme-color" content="#020617">
<style>
html,body{height:100%;margin:0;background:#020617;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;place-items:center}.boot{display:grid;gap:10px;text-align:center;padding:24px;max-width:420px}.boot strong{font-size:15px}.boot span{font-size:12px;color:#94a3b8}.error{color:#f87171}
</style>
<script>
(function(){
  'use strict';
  var params=new URLSearchParams(location.search);
  var requested=String(params.get('mode')||'mock').toLowerCase();
  var target=requested==='auction'?'auction.html':'mock-draft-v4.html';
  params.delete('mode');
  if(requested==='live') params.set('draftMode','manual');
  if(!params.has('embed') && window.self!==window.top) params.set('embed','1');
  var suffix=params.toString();
  location.replace(target+(suffix?'?'+suffix:''));
})();
</script>
</head>
<body>
<div class="boot"><strong>Opening Draft Room…</strong><span>If this screen remains visible, refresh once.</span></div>
</body>
</html>
