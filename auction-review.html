<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auction Review — Front Office</title><style>:root{--b:#020617;--p:#0f172a;--l:#334155;--t:#f1f5f9;--m:#94a3b8;--g:#f59e0b;--ok:#34d399;--r:#f87171}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px system-ui}header,main{max-width:920px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;border-bottom:1px solid var(--l)}a{color:var(--ok)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--p);border:1px solid var(--l);border-radius:10px;padding:14px;margin:12px 0}.metric strong{display:block;font-size:25px}.muted{color:var(--m);font-size:12px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--l)}.good{color:var(--ok)}.bad{color:var(--r)}button{background:var(--g);border:0;border-radius:7px;padding:10px;font-weight:800}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}</style></head><body><header><strong>Auction Post-Draft Review</strong><a href="auction.html">Back to Auction</a></header><main id="app"></main><script src="js/draft-session.js"></script><script src="js/draft-intelligence.js"></script><script src="js/draft-review.js"></script><script>(function(){const app=document.getElementById('app'),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),loaded=FFODraftSession.safeLoad(localStorage,'ffo_auction_session_v4','auction');if(!loaded.ok||!loaded.payload||!loaded.payload.myRoster.length){app.innerHTML='<div class="card"><h2>No auction purchases found</h2><p class="muted">Record your purchases in the Auction Engine first.</p></div>';return}const p=loaded.payload,r=FFODraftReview.analyzeAuction(p,FFODraftIntelligence),rows=(items,empty)=>items.length?items.map(x=>`<div class="row"><span>${e(x.name)} · ${e(x.position)}</span><strong class="${x.surplus>=0?'good':'bad'}">${x.surplus>=0?'+':''}$${x.surplus}</strong></div>`).join(''):`<p class="muted">${empty}</p>`;app.innerHTML=`<p class="muted">${e(r.disclaimer)}</p><div class="grid"><div class="card metric">Draft Fit<strong>${r.grade} · ${r.gradeScore}</strong></div><div class="card metric">Spend<strong>$${r.spend}</strong></div><div class="card metric">Surplus<strong>${r.totalSurplus>=0?'+':''}$${r.totalSurplus}</strong></div><div class="card metric">Unused<strong>$${r.remaining}</strong></div></div><div class="two"><section class="card"><h2>Value buys</h2>${rows(r.values,'No purchases at least $3 below expected price.')}</section><section class="card"><h2>Overpays</h2>${rows(r.overpays,'No purchases at least $3 above expected price.')}</section></div><div class="card"><h2>Roster construction</h2><p>Starter surplus: <strong>${r.starterSurplus>=0?'+':''}$${r.starterSurplus}</strong> · Bench surplus: <strong>${r.benchSurplus>=0?'+':''}$${r.benchSurplus}</strong></p><p class="muted">${r.rosterValid?'Every recorded purchase is accounted for in the optimized lineup/bench.':e(r.issues.join(' · '))}</p><button id="export">Download replay JSON</button></div>`;document.getElementById('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(FFODraftReview.auctionArtifact(p,r),null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=`front-office-auction-review-${Date.now()}.json`;a.click();URL.revokeObjectURL(u)}})();</script></body></html>
